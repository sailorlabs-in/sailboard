services:
  # ====================================================
  # Sailboard Unified Application (Frontend & Backend)
  # Route-based routing through ONE single host port (3250):
  #   - http://<host>:3250/           -> React Frontend Web UI
  #   - http://<host>:3250/api        -> NestJS Backend API
  #   - http://<host>:3250/whiteboard -> WebSocket Gateway
  # ====================================================
  sailboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sailboard-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3333 # Internal backend API port
      DATABASE_URL: ${DATABASE_URL:-postgresql://umangsailor:Umang6Sailor@postgres.sailorlabs.in/sailboard?schema=public}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-sailboard_super_secret_jwt_key_2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Single entrypoint port on the host:
      - "${APP_PORT:-3250}:80"
